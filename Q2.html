<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Template</title>
    <style>
        /* --- CSS Reset & Variables --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #141414;        /* Darkest background */
            --card-bg: #1f1f1f;         /* Dark gray card background */
            --btn-bg: #333333;          /* Button background */
            --text-main: #ffffff;       /* White text */
            --text-muted: #d1d5db;      /* Light gray text */
            --accent: #c4f82a;          /* Lime green accent */
        }

        /* --- Global Body Styling --- */
        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* --- Card Container --- */
        .profile-card {
            background-color: var(--card-bg);
            width: 380px;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
        }

        /* --- Profile Image --- */
        .profile-card img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        /* --- Typography --- */
        .profile-card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .location {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* --- Social Links Container --- */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Adds space between buttons */
        }

        /* --- Social Links Styling (The Buttons) --- */
        .social-link-btn {
            background-color: var(--btn-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- Hover Effect --- */
        .social-link-btn:hover {
            background-color: var(--accent);
            color: #333333; /* Dark text for contrast against the lime background */
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Replace the src with a real image URL or local file path -->
        <img src="https://i.pravatar.cc/150?img=47" alt="Jessica Randall Profile Picture">
        
        <h2>Jessica Randall</h2>
        <p class="location">London, United Kingdom</p>
        <p class="bio">"Front-end developer and avid reader."</p>

        <div class="social-links">
            <a href="#" class="social-link-btn">GitHub</a>
            <a href="#" class="social-link-btn">Frontend Mentor</a>
            <a href="#" class="social-link-btn">LinkedIn</a>
            <a href="#" class="social-link-btn">Twitter</a>
            <a href="#" class="social-link-btn">Instagram</a>
        </div>
    </div>

</body>
</html>
