<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <link rel="stylesheet" href="Q4.css">
</head>
<body>

    <div class="signup-container">
        <section class="banner-section">
            <img class="hero-image" src="./../Media/login-image.jpg">
            <h3 class="brand-name">CodeCamp</h3>
            <h1 class="banner-title">Start Your Journey</h1>
            <p class="banner-text">
                Learn the skills you need to build modern websites 
                and bring your ideas to life.
            </p>
        </section>

        <section class="form-section">
            <h2 class="form-title">Create an Account</h2>
            
            <form action="#">
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="input-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Enter your mobile number">
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email address">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password">
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree to the Terms & Conditions</label>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </section>
    </div>

</body>
</html>
