<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>
</head>
<body>

    <table border="1" cellpadding="10">

        <tr>
            <th>Number</th>
            <th>Result</th>
        </tr>

        <?php

        $n = 5;

        for($i = 1; $i <= 10; $i++){
            ?>
            <tr>
                <td><?php echo $n." X ".$i ?></td>
                <td><?php echo $n * $i ?></td>
            </tr>
            <?php
        }

        ?>

    </table>

</body>
</html>
